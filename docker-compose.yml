services:
  outlookemail:
    image: ghcr.io/zkk520/outlookemail:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    mem_limit: 256m
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -sf http://localhost:5000/login"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
